services:
  server:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: express_shop
    volumes:
      - .:/express_playground
      - /express_playground/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/postgres?schema=public
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - shop
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DATABASE_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop

  static:
    image: nginx:alpine
    container_name: nginx_static
    restart: unless-stopped
    volumes:
      - ./docker-config:/usr/share/nginx/html
      - ./docker-config/nginx.conf:/etc/nginx/conf.d/default.conf
    ports: 
      - "8081:80"
    depends_on:
      - server
    networks:
      - shop

volumes:
  postgres_data:
networks:
  shop:
    driver: bridge